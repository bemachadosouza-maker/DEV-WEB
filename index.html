<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula  com CSS</title>
      <link rel="stylesheet" href="/style.css">


</head>
<body>

    <h1>Cadastros alunos</h1>
    <h2 >Alunos Cadastro</h2>
    <table border="5px">
      <hr>
      <thead>
          <tr>
          <th>Nome</th>
          <th>Curso</th>
          <th>Idade</th>
          <th>Cidade</th>
          </tr>
      </thead>
      <br><br>
    <tbody>
      <tr>
        <td>Bernardo Machado</td>
        <td>Desenvolvedor de Sistemas</td>
        <td>15</td>
        <td>Novo Hamburgo</td>
      </tr>
    </tbody> 
    <br><br>
      <tr>
        <td>Lucas Apollo</td>
        <td>Desenvolvedor de Sistemas</td>
        <td>15</td>
        <td>Novo Hamburgo</td>
      </tr>
      <tr>
        <td>Vitoria Isabella</td>
        <td>Desenvolvedor de Sistemas</td>
        <td>16</td>
        <td>Porto Alegre</td>
      </tr>
    </table>

    <h2>Novo Cadastro:</h2>
    <hr>
    <form action="#" method="post">
      
      <label for="nome">Nome Completo:</label>
      <br><br>
      <input type="text" id="nome" placeholder="Digite seu nome...">
      <br><br>

      <label for="email">Email:</label>
      <br><br>
      <input type="text" id="gmail" placeholder="Digite seu email...">
      <br><br>

      <label for="idade">Idade:</label>
      <br><br>
      <input type="number" id="idade" placeholder="Digite sua idade...">
      <br><br>

      <label for="curso"> Escolha seu curso</label>
      <br><br>

        <select name="curso" id="curso">
        <option value="">Selecione um Curso</option>
        <option value="Informatica">Informatica</option>
        <option value="Excel">Excel</option>
        <option value="Desenvolvimento">Desenvolvimento de Sistema</option>
      </select>
      <br><br>
      <label for="mensagem">Observação</label>
      <br><br>
      <textarea name="" id="mensagem" rows="5" placeholder="digite alguma Observação..."></textarea>

      <button type="submit">Cadastrar</button>
    </form>
</body>
</html>

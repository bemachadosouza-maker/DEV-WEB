<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>

</head>
<body>
    
 <form action="#" method="post">
    
        <table>
        <th>Login:</th>
        <h1>GELEDAIRA</h1>
          <table border="5" cellpadding="10" cellspacing="0">


            <label for="Nome">nome:</label>
            <input type="text" id="Nome" placeholder="Seu nome..." required>
            <br><br>
            <label for="email">email:</label>
            <input type="email" id="email" placeholder="seuemail@gmail.com">
            <br><br>
            <label for="Senha">Senha:</label>
            <input type="password" id="Senha" required>
            <br><br>

            
<button class="btn-entrar" onclick="window.location.href='/login'">
    Entrar
  </button>
  
  <style>
  .btn-entrar {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
  }
  
  .btn-entrar:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
  }
  
  .btn-entrar:active {
    transform: scale(0.96);
  }
  </style>
  

        <h3>Cidades:</h3>

            <label for="Cidade" id="Cidade"></label>
            <select name="Cidade" id="cidade">
                <option value="selecione..."></option>
                <option value="NH">Novo Hamburgo</option>
                <option value="SL">São Leopoldo</option>
                <option value="CB">Campo Bom</option>
                <option value="MGO">Montenegros</option>
                <br><br>
              </select>



                <fieldset>
                  <Legend>Genero:</Legend> 
                  <input type="radio" id="masc" name="genero" value="M">
                  <label for="Masc">Masculino</label>
                  <input type="radio" id="fem" name="genero" value="F">
                  <label for="fem">Feminino</label>
              </fieldset>
                
        </form>
</body>
</html>
